name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependências do client
        run: npm ci
        working-directory: client

      - name: Gerar dados estáticos e build
        # VITE_BASE_PATH assume um "project page" (usuario.github.io/<repo>/).
        # Se este repositório publicar em um domínio próprio (CNAME) ou for
        # um "user/organization page" (usuario.github.io), troque para "/".
        run: npm run build:pages
        working-directory: client
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
